<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Screen Toggle</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      transition: background-color 0s ease;
    }
  </style>
</head>
<body>
  <script>
    let toggle = false;
    let count = 0;
    const maxCount = 1680; // 35 minutes = 2100 seconds, cycle time = 1.25s (750ms + 500ms)

    function toggleScreen() {
      if (toggle) {
        document.body.style.backgroundColor = "white";
        setTimeout(toggleScreen, 750); // White screen duration
      } else {
        document.body.style.backgroundColor = "black";
        setTimeout(toggleScreen, 500); // Black screen duration
      }
      toggle = !toggle;
      count++;
      if (count >= maxCount) {
        return; // Stop the alternation
      }
    }

    toggleScreen(); // Start the alternation
  </script>
</body>
</html>
