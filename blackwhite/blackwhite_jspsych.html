<!DOCTYPE html>
<html>
  <head>
    <title>Black/White Muse Synchronisation Test</title>
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-image-keyboard-response@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-fullscreen@2.1.0"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
  </head>
  <body></body>
  <script>

    /* LSL bridge */
    var lslBaseTime = null

    function syncLSL() {
        return new Promise(async function (resolve, reject) {
            try {
                let offsets = []
                for (let i = 0; i < 3; i++) {
                    var startPerf = performance.now()
                    let resp = await fetch("http://10:60:70:86:5000/sync", { cache: "no-store" })
                    let text = await resp.text()
                    var lslTime = parseFloat(text)
                    var endPerf = performance.now()
                    var perfMid = (startPerf + endPerf) / 2
                    offsets.push(lslTime - perfMid / 1000)
                    await new Promise((r) => setTimeout(r, 100)) // Short delay between syncs
                }
                lslBaseTime = offsets.reduce((a, b) => a + b, 0) / offsets.length
                console.log("LSL sync done (averaged):", lslBaseTime)
                resolve(lslBaseTime)
            } catch (e) {
                console.error("LSL sync exception:", e)
                reject(e)
            }
        })
    }

    function sendMarker(value = "1") {
        // If not synced, still send marker (server will timestamp with local_clock())
        if (lslBaseTime === null) {
            console.warn("LSL not synced yet - sending without JS timestamp")
            fetch("http://10:60:70:86:5000/marker?value=" + encodeURIComponent(value))
                .then(function () {
                    console.log("sent marker (no-ts)", value)
                })
                .catch(function (err) {
                    console.error("Marker send error:", err)
                })
            return
        }

        var ts = lslBaseTime + performance.now() / 1000
        var url = "http://10:60:70:86:5000/marker?value=" + encodeURIComponent(value) + "&ts=" + encodeURIComponent(ts)
        fetch(url)
            .then(function () {
                console.log("sent marker", value, "ts", ts)
            })
            .catch(function (err) {
                console.error("Marker send error:", err)
            })
    }

    /* initialize jsPsych */
    var jsPsych = initJsPsych({
      override_safe_mode: true
    });

    /* create timeline */
    var timeline = [];


    /* preload images */
    var preload = {
      type: jsPsychPreload,
      images: ['white.png', 'black.png']
    };
    timeline.push(preload);

    /* define trial stimuli array for timeline variables */
    var test_stimuli = [
      { stimulus: "white.png", duration: 750 },
      { stimulus: "black.png", duration: 500 }
    ];

    /* single trial that uses timeline variables */
    var test = {
    type: jsPsychImageKeyboardResponse,
    stimulus: jsPsych.timelineVariable("stimulus"),
    trial_duration: jsPsych.timelineVariable("duration"),
    choices: "NO_KEYS",
    data: {
        task: 'response'
    },

    /* Send LSL marker on stimulus onset (white = 1, black = 0) */
    on_start: function(trial) {
        if (trial.stimulus === "white.png") {
        sendMarker(1);
        } else if (trial.stimulus === "black.png") {
        sendMarker(0);
        }
    }
    };

    /* define test procedure */
    var test_procedure = {
      timeline: [test],
      timeline_variables: test_stimuli,
      randomize_order: false
    };

    /* loop that procedure for 35 minutes (2,100,000 ms) */
    var loop_node = {
      timeline: [test_procedure],
      loop_function: function() {
        return jsPsych.getTotalTime() < 2100000;
      }
    };

    timeline.push(loop_node);

    /* start the experiment */
    jsPsych.run(timeline);

  syncLSL()
      .then(function () {
          startExperiment()
      })
      .catch(function (err) {
          console.warn("Proceeding without LSL sync (sync failed):", err)
          startExperiment()
      })

  </script>
</html>
